   <g id="text_1">
    <text style="fill: #183247; font: 700 22px 'Noto Sans CJK JP'; text-anchor: start" x="21.6" y="33.395312" transform="rotate(-0 21.6 33.395312)">同じ判断設定で、全情報と既知情報を照合する</text>
   </g>
   <g id="text_2">
    <text style="fill: #587080; font: 12px 'Noto Sans CJK JP'; text-anchor: start" x="21.6" y="56.35125" transform="rotate(-0 21.6 56.35125)">研究構想図：モデル内で成立する事象と、与えられた知識から区別できる事象を分ける。</text>
   </g>
   <g id="text_3">
    <text style="fill: #183247; font: 700 17px 'Noto Sans CJK JP'; text-anchor: start" x="39.6" y="125.165469" transform="rotate(-0 39.6 125.165469)">全情報の状態 x*</text>
   </g>
   <g id="text_4">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 154.99125)">患者文脈・空間的文脈</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 172.544438)">要因別・中間・総合の評価</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 190.097625)">事前に定めた事象の成立を確認</text>
   </g>
   <g id="text_5">
    <text style="fill: #183247; font: 700 17px 'Noto Sans CJK JP'; text-anchor: start" x="39.6" y="291.485469" transform="rotate(-0 39.6 291.485469)">既知情報 KF</text>
   </g>
   <g id="text_6">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 321.31125)">既知の条件と整合する</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 339.271313)">複数の状態 Ω(KF) を残す</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 356.8245)">未知の値をゼロで埋めない</text>
   </g>
   <g id="text_7">
    <text style="fill: #183247; font: 700 16px 'Noto Sans CJK JP'; text-anchor: start" x="320.4" y="125.2" transform="rotate(-0 320.4 125.2)">既存 RiskEngine を再利用</text>
   </g>
   <g id="text_8">
    <text style="fill: #087f8c; font: 700 15px 'Noto Sans CJK JP'" transform="translate(320.4 170.369531)">同じAHP重み</text>
    <text style="fill: #087f8c; font: 700 15px 'Noto Sans CJK JP'" transform="translate(320.4 193.611328)">同じFuzzy回答</text>
    <text style="fill: #087f8c; font: 700 15px 'Noto Sans CJK JP'" transform="translate(320.4 215.525039)">同じモデル構成</text>
   </g>
   <g id="text_9">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(320.4 262.27125)">各状態で、同じ要因・中間評価・</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(320.4 279.824438)">実装済み条件を調べる。</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(320.4 297.377625)">存在しない関係を加えない。</text>
   </g>
   <g id="text_10">
    <text style="fill: #183247; font: 700 15px 'Noto Sans CJK JP'; text-anchor: start" x="617.76" y="123.569531" transform="rotate(-0 617.76 123.569531)">成立しているが、既知事実だけでは特定できない</text>
   </g>
   <g id="text_11">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(617.76 159.31125)">全情報では事象が成立する。</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(617.76 176.864438)">許容される別の状態では、その事象が成立しない。</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(617.76 194.417625)">その組合せを判定根拠として記録する。</text>
   </g>
   <g id="text_12">
    <text style="fill: #183247; font: 700 15px 'Noto Sans CJK JP'; text-anchor: start" x="617.76" y="299.249531" transform="rotate(-0 617.76 299.249531)">KE・KRの明示条件は別に扱う</text>
   </g>
   <g id="text_13">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(617.76 332.11125)">関係の知識、具体的な危険内容の把握を区別。</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(617.76 349.664438)">記載なしを未認識と決めず、人の認知を推定しない。</text>
   </g>
   <g id="text_14">
    <text style="fill: #087f8c; font: 700 13px 'Noto Sans CJK JP'; text-anchor: start" x="25.2" y="445.973594" transform="rotate(-0 25.2 445.973594)">比較上の重要点：同じ事象出力への条件付き期待値でも、同じ成立／未確定判定を得られる場合がある。</text>
   </g>
   <g id="text_15">
    <text style="fill: #587080; font: 11px 'Noto Sans CJK JP'; text-anchor: start" x="25.2" y="480.355313" transform="rotate(-0 25.2 480.355313)">模式図。候補方式の新規性・同定性能・臨床的有効性は未確認です。</text>
   </g>
  </g>
 </g>
