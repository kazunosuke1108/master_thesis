   <g id="text_1">
    <text style="fill: #183247; font: 700 22px 'Noto Sans CJK JP'; text-anchor: start" x="21.6" y="34.835312" transform="rotate(-0 21.6 34.835312)">スタッフ提示画面の設計例</text>
   </g>
   <g id="text_2">
    <text style="fill: #587080; font: 13px 'Noto Sans CJK JP'; text-anchor: start" x="21.6" y="56.427188" transform="rotate(-0 21.6 56.427188)">研究者用の全情報・正解・比較結果を、この画面には表示しない。</text>
   </g>
   <g id="text_3">
    <text style="fill: #183247; font: 700 17px 'Noto Sans CJK JP'; text-anchor: start" x="37.44" y="108.605469" transform="rotate(-0 37.44 108.605469)">提示前：与えられた情報を確認</text>
   </g>
   <g id="text_4">
    <text style="fill: #587080; font: 13px 'Noto Sans CJK JP'; text-anchor: start" x="51.84" y="160.827188" transform="rotate(-0 51.84 160.827188)">場面資料（匿名化した図・画像）</text>
   </g>
   <g id="text_5">
    <text style="fill: #ffffff; font: 700 12px 'Noto Sans CJK JP'; text-anchor: middle" x="176.4" y="211.895625" transform="rotate(-0 176.4 211.895625)">P01</text>
   </g>
   <g id="text_6">
    <text style="fill: #587080; font: 10px 'Noto Sans CJK JP'; text-anchor: start" x="244.8" y="209.559375" transform="rotate(-0 244.8 209.559375)">未提示の領域</text>
   </g>
   <g id="text_7">
    <text style="fill: #587080; font: 10px 'Noto Sans CJK JP'; text-anchor: start" x="51.84" y="262.839375" transform="rotate(-0 51.84 262.839375)">初期PoC：仮想スタッフに与える情報条件を表示</text>
   </g>
   <g id="text_8">
    <text style="fill: #183247; font: 700 14px 'Noto Sans CJK JP'; text-anchor: start" x="39.6" y="327.971563" transform="rotate(-0 39.6 327.971563)">既知として与えられた内容</text>
   </g>
   <g id="text_9">
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 354.43125)">患者の立ち上がりは把握している。</text>
    <text style="fill: #183247; font: 12px 'Noto Sans CJK JP'" transform="translate(39.6 371.984438)">その他の情報は、シナリオで指定した範囲だけを提示。</text>
   </g>
   <g id="text_10">
    <text style="fill: #183247; font: 11px 'Noto Sans CJK JP'" transform="translate(51.84 434.995313)">危険内容・根拠の記録欄</text>
    <text style="fill: #183247; font: 11px 'Noto Sans CJK JP'" transform="translate(51.84 451.085734)">本評価への置換時も、同じ項目で記録できる設計とする。</text>
   </g>
   <g id="text_11">
    <text style="fill: #183247; font: 700 17px 'Noto Sans CJK JP'; text-anchor: start" x="545.04" y="108.605469" transform="rotate(-0 545.04 108.605469)">提示後：追加の危険情報を確認</text>
   </g>
   <g id="text_12">
    <text style="fill: #587080; font: 13px 'Noto Sans CJK JP'; text-anchor: start" x="559.44" y="160.827188" transform="rotate(-0 559.44 160.827188)">場面資料（匿名化した図・画像）</text>
   </g>
   <g id="text_13">
    <text style="fill: #ffffff; font: 700 12px 'Noto Sans CJK JP'; text-anchor: middle" x="684" y="211.895625" transform="rotate(-0 684 211.895625)">P01</text>
   </g>
   <g id="text_14">
    <text style="fill: #587080; font: 10px 'Noto Sans CJK JP'; text-anchor: start" x="806.4" y="209.559375" transform="rotate(-0 806.4 209.559375)">IVポール</text>
   </g>
   <g id="text_15">
    <text style="fill: #587080; font: 10px 'Noto Sans CJK JP'; text-anchor: start" x="559.44" y="262.839375" transform="rotate(-0 559.44 262.839375)">初期PoC：仮想スタッフに与える情報条件を表示</text>
   </g>
   <g id="text_16">
    <text style="fill: #bd681b; font: 700 13px 'Noto Sans CJK JP'; text-anchor: start" x="559.44" y="339.413594" transform="rotate(-0 559.44 339.413594)">追加の出力例</text>
   </g>
   <g id="text_17">
    <text style="fill: #183247; font: 13px 'Noto Sans CJK JP'; text-anchor: start" x="559.44" y="362.427188" transform="rotate(-0 559.44 362.427188)">患者P01の近くに、IVポールがあります。</text>
   </g>
   <g id="text_18">
    <text style="fill: #183247; font: 11px 'Noto Sans CJK JP'" transform="translate(559.44 434.995313)">提示された危険内容・根拠を記録</text>
    <text style="fill: #183247; font: 11px 'Noto Sans CJK JP'" transform="translate(559.44 451.085734)">対話や通知文面の最適化を研究の中心にはしない。</text>
   </g>
   <g id="text_19">
    <text style="fill: #587080; font: 11px 'Noto Sans CJK JP'; text-anchor: start" x="21.6" y="569.635313" transform="rotate(-0 21.6 569.635313)">画面設計図・未実装。内容は仮想例であり、モデルにない危険増幅や臨床的安全性を主張しません。</text>
   </g>
